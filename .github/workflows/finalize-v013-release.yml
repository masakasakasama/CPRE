name: Finalize v0.13.0 release

on:
  push:
    branches: [main]
    paths:
      - .release/finalize-v013-trigger.txt

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply final refactor
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const pagePath = 'app/page.tsx';
          let page = fs.readFileSync(pagePath, 'utf8');

          const studyImport = 'import { studyGuides } from "./study";';
          const configImport = 'import { APP_VERSION, EXAM_KEY, GITHUB_TOKEN_STORAGE, INTRO_KEY, LOCAL_SAVED_AT_KEY, STORAGE_KEY, SYNC_KEY_STORAGE } from "./app-config";';
          if (!page.includes(configImport)) {
            if (!page.includes(studyImport)) throw new Error('page.tsx study import anchor missing');
            page = page.replace(studyImport, `${studyImport}\n${configImport}`);
          }

          const legacyConstants = `const STORAGE_KEY = "cpre-english-study:v1";\nconst EXAM_KEY = "cpre-english-study:exam:v1";\nconst INTRO_KEY = "cpre-english-study:intro:v1";\nconst LOCAL_SAVED_AT_KEY = "cpre-english-study:saved-at:v1";\nconst SYNC_KEY_STORAGE = "cpre-english-study:sync-key";\nconst GITHUB_TOKEN_STORAGE = "cpre-english-study:github-token";\nconst APP_VERSION = "0.12.0";\n\n`;
          if (page.includes(legacyConstants)) page = page.replace(legacyConstants, '');
          if (/const APP_VERSION\s*=/.test(page)) throw new Error('page.tsx still has local APP_VERSION');

          const answeredAnchor = '    const nextAnswered = { ...progress.answered };\n';
          if (!page.includes('const submittedAt = new Date().toISOString();')) {
            if (!page.includes(answeredAnchor)) throw new Error('submitExam answered anchor missing');
            page = page.replace(answeredAnchor, `${answeredAnchor}    const submittedAt = new Date().toISOString();\n`);
          }

          const oldOverwrite = '      nextAnswered[question.id] = { selected, correct: exact, lastAt: new Date().toISOString() };';
          const preservedHistory = `      const previous = nextAnswered[question.id];\n      nextAnswered[question.id] = {\n        selected,\n        correct: exact,\n        lastAt: submittedAt,\n        attempts: [...(previous?.attempts ?? []), { selected, correct: exact, at: submittedAt }].slice(-50),\n      };`;
          if (page.includes(oldOverwrite)) page = page.replace(oldOverwrite, preservedHistory);
          if (page.includes(oldOverwrite)) throw new Error('mock submission still overwrites history');

          const oldResult = '    const result: MockResult = { at: new Date().toISOString(), percent: Math.round((points / total) * 100), correct, points: Math.round(points * 10) / 10, total };';
          const newResult = '    const result: MockResult = { at: submittedAt, percent: Math.round((points / total) * 100), correct, points: Math.round(points * 10) / 10, total };';
          if (page.includes(oldResult)) page = page.replace(oldResult, newResult);
          fs.writeFileSync(pagePath, page);

          const config = fs.readFileSync('app/app-config.ts', 'utf8');
          if (!config.includes('APP_VERSION = "0.13.0"')) throw new Error('app-config version is not 0.13.0');

          const testPath = 'tests/rendered-html.test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          const oldReads = `  const [data, additional, page, packageJson] = await Promise.all([\n    readFile(new URL("../app/data.ts", import.meta.url), "utf8"),\n    readFile(new URL("../app/additional-questions.ts", import.meta.url), "utf8"),\n    readFile(new URL("../app/page.tsx", import.meta.url), "utf8"),\n    readFile(new URL("../package.json", import.meta.url), "utf8"),\n  ]);`;
          const newReads = `  const [data, additional, page, packageJson, config] = await Promise.all([\n    readFile(new URL("../app/data.ts", import.meta.url), "utf8"),\n    readFile(new URL("../app/additional-questions.ts", import.meta.url), "utf8"),\n    readFile(new URL("../app/page.tsx", import.meta.url), "utf8"),\n    readFile(new URL("../package.json", import.meta.url), "utf8"),\n    readFile(new URL("../app/app-config.ts", import.meta.url), "utf8"),\n  ]);`;
          if (test.includes(oldReads)) test = test.replace(oldReads, newReads);
          const oldVersionAssertion = '  assert.match(page, /const APP_VERSION = "0\\.12\\.0"/);';
          const newVersionAssertions = `  assert.match(config, /APP_VERSION = "0\\.13\\.0"/);\n  assert.doesNotMatch(page, /const APP_VERSION\\s*=/);\n  assert.match(packageJson, /"version": "0\\.13\\.0"/);`;
          if (test.includes(oldVersionAssertion)) test = test.replace(oldVersionAssertion, newVersionAssertions);
          if (test.includes('const APP_VERSION = "0\\.12\\.0"')) throw new Error('rendered-html test still expects local v0.12.0');
          fs.writeFileSync(testPath, test);
          NODE

          npm version 0.13.0 --no-git-tag-version

      - name: Install
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Validate content
        run: npm run content:validate
      - name: Test and production build
        run: npm run test

      - name: Record successful validation
        run: |
          mkdir -p .release
          {
            echo "version=0.13.0"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "npm_ci=passed"
            echo "lint=passed"
            echo "content_validate=passed"
            echo "test_and_build=passed"
          } > .release/v0.13.0-ready.txt

      - name: Commit finalized release source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx tests/rendered-html.test.mjs package.json package-lock.json .release/v0.13.0-ready.txt
          git commit -m "Finalize validated v0.13.0 release"
          git push
