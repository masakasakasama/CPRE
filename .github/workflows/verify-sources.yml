name: Verify official sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run sources:download
