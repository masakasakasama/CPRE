name: CI

on:
  pull_request:
    paths-ignore:
      - ".release/**"
  push:
    branches: [main]
    paths-ignore:
      - ".release/**"

permissions:
  contents: read

concurrency:
  group: cpre-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run content:validate
      - run: npm run test
