name: Finalize v0.13 safely

on:
  push:
    branches: [main]
    paths:
      - scripts/finalize-v013.mjs

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply exact safe changes
        run: node scripts/finalize-v013.mjs
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run content:validate
      - run: npm run test
      - name: Commit validated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx package-lock.json
          git commit -m "Finalize safe v0.13.0 refactor"
          git push
