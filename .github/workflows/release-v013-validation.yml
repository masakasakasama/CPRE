name: Validate v0.13.0 release

on:
  push:
    branches: [main]
    paths:
      - .release/v0.13.0-trigger.txt

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate release
        id: validate
        shell: bash
        run: |
          set +e
          : > /tmp/release-validation.log
          npm ci --ignore-scripts 2>&1 | tee -a /tmp/release-validation.log
          CI_RC=${PIPESTATUS[0]}
          if [ "$CI_RC" -eq 0 ]; then npm run lint 2>&1 | tee -a /tmp/release-validation.log; LINT_RC=${PIPESTATUS[0]}; else LINT_RC=99; fi
          if [ "$CI_RC" -eq 0 ]; then npm run content:validate 2>&1 | tee -a /tmp/release-validation.log; CONTENT_RC=${PIPESTATUS[0]}; else CONTENT_RC=99; fi
          if [ "$CI_RC" -eq 0 ]; then npm run test 2>&1 | tee -a /tmp/release-validation.log; TEST_RC=${PIPESTATUS[0]}; else TEST_RC=99; fi
          mkdir -p .release
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "npm_ci=$CI_RC"
            echo "lint=$LINT_RC"
            echo "content_validate=$CONTENT_RC"
            echo "test=$TEST_RC"
            echo "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "--- tail ---"
            tail -n 80 /tmp/release-validation.log
          } > .release/v0.13.0-validation.txt
          if [ "$CI_RC" -eq 0 ] && [ "$LINT_RC" -eq 0 ] && [ "$CONTENT_RC" -eq 0 ] && [ "$TEST_RC" -eq 0 ]; then
            echo "result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Persist validation result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release/v0.13.0-validation.txt
          git commit -m "Record v0.13.0 release validation" || true
          git push
      - name: Fail when validation failed
        if: steps.validate.outputs.result != 'passed'
        run: exit 1
